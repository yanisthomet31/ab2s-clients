<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB2S Sécurité — Connexion</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div>
  <div class="login-card">
    <div class="login-logo"><img src="assets/logo.png" alt="AB2S Sécurité"></div>
    <h1>Bon retour parmi nous</h1>
    <p class="page-sub">Connectez-vous à la base clients AB2S Sécurité</p>

    <form id="login-form" class="login-form">
      <div class="form-group">
        <label for="l-username">Identifiant</label>
        <input type="text" id="l-username" placeholder="Votre identifiant" autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label for="l-password">Mot de passe</label>
        <input type="password" id="l-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Se connecter</button>
    </form>

    <p id="login-error" class="login-error"></p>
  </div>
  <p class="login-foot">© AB2S Sécurité — Accès réservé</p>
</div>

<script src="login.js"></script>
</body>
</html>
